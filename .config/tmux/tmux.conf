## Set vi-mode
# set-window-option -g mode-keys vi
## Seybindings
# bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Move current window one position left/right and stay on it
bind-key -n S-Left  swap-window -d -t -1
bind-key -n S-Right swap-window -d -t +1

# Open panes in current dir
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Open new windows in the current pane's working directory
bind c new-window -c "#{pane_current_path}"

# Shift+alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start index of window/pane with 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Fix Colors in tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Fix Cursor 
set -as terminal-features ',*:cursorstyle'

# Make tmux bar transparent 
set -g status-style bg=default,fg=white
# Show current network in the right status bar
set -g status-right ''
# Disable border highlights
set -g pane-border-style fg=default
set -g pane-active-border-style fg=default

set -sg escape-time 0
# Enable focus events for vim autoread
set -g focus-events on

# ============================================
# PLUGINS (via TPM)
# ============================================
 
# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# tmux / vim navigator
set -g @vim_navigator_mapping_left "C-h"  # use C-h
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

# Init TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
